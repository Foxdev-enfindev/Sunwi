<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="fr" data-bg-mode="dark" data-theme="{{ current_theme if current_theme else session.get('theme', 'green') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sunwi{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon_io/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon_io/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon_io/favicon-16x16.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon_io/favicon.ico') }}">
    
    <script src="{{ url_for('static', filename='theme.js') }}?v=4"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="sunwi-body">

    <!-- Header compact : Logo à gauche, Menu à droite -->
    <header class="sunwi-header py-2 mb-3">
        <div class="container-fluid px-3 px-md-4 d-flex justify-content-between align-items-center">
            <a href="{{ url_for('main.hub') }}" class="sunwi-logo text-decoration-none fw-bold fs-4">
                <span class="sunwi-brand-text">Sunwi</span>
            </a>
            <div>
                {% include 'includes/user_menu.html' %}
            </div>
        </div>
    </header>

    <main class="sunwi-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/duel_engine.js') }}?v=4"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
