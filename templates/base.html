<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="fr" data-bg-mode="dark" data-theme="{{ current_theme if current_theme else session.get('theme', 'green') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sunwi{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="sunwi-body">

    <header class="sunwi-header py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="{{ url_for('main.hub') }}" class="sunwi-logo text-decoration-none fw-bold fs-4">
                <span class="sunwi-brand-text">Sunwi</span>
            </a>
            {% include 'includes/user_menu.html' %}
        </div>
    </header>

    <main class="sunwi-content">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/duel_engine.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function setAudioMode(mode) {
        fetch('/set_audio_mode', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ mode: mode })
        })
        .then(response => {
            if (response.ok) {
                window.location.reload();
            }
        });
    }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
