<!-- templates/includes/user_menu.html -->
{% set user = session.get('sunwi_user') or session.get('user_profile') %}

{% if user %}
<div class="dropdown">
    <button class="btn btn-outline-light btn-sm rounded-pill dropdown-toggle d-flex align-items-center gap-2 px-3 py-1 shadow-sm" type="button" id="userMenuButton" data-bs-toggle="dropdown" aria-expanded="false" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2);">
        {% if user.picture %}
            <img src="{{ user.picture }}" alt="Avatar" class="rounded-circle" width="22" height="22">
        {% else %}
            <span class="badge rounded-circle text-white" style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; background-color: #d946ef;">
                {{ user.name[0] if user.name else 'U' }}
            </span>
        {% endif %}
        <span class="fw-semibold text-truncate" style="max-width: 130px;">{{ user.name or 'Mon compte' }}</span>
    </button>
    
    <ul class="dropdown-menu dropdown-menu-end shadow-lg p-2" aria-labelledby="userMenuButton" style="background-color: #1e293b; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; min-width: 220px;">
        <li class="px-3 py-2 mb-2 rounded" style="background: rgba(255,255,255,0.03);">
            <div class="fw-bold text-white small text-truncate">{{ user.name }}</div>
            <div class="text-secondary extra-small text-truncate" style="font-size: 0.75rem;">{{ user.email }}</div>
        </li>
        <li>
            <a class="dropdown-item text-white rounded py-2 d-flex align-items-center gap-2" href="{{ url_for('main.profile') }}">
                👤 <span>Mon Profil</span>
            </a>
        </li>
        <li>
            <a class="dropdown-item text-white rounded py-2 d-flex align-items-center gap-2" href="{{ url_for('main.hub') }}">
                🏎️ <span>Tableau de bord</span>
            </a>
        </li>
        <li><hr class="dropdown-divider my-2" style="border-color: rgba(255,255,255,0.1);"></li>
        <li>
            <a class="dropdown-item text-danger rounded py-2 d-flex align-items-center gap-2" href="{{ url_for('auth.logout') }}">
                🚪 <span>Déconnexion</span>
            </a>
        </li>
    </ul>
</div>
{% else %}
<a href="{{ url_for('auth.google_login') }}" class="btn btn-warning btn-sm rounded-pill px-3 fw-bold">
    Se connecter
</a>
{% endif %}
